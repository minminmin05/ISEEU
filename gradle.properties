# -Duser.language/-Duser.country pin the JVM to a neutral locale. Without this, a Thai-locale
# Windows machine can make legacy java.util.Calendar/date code compute Buddhist-calendar-shifted
# (+543 year) values internally, which then fail range checks in unrelated places (seen here: a
# JDK zip-metadata parser, and AGP's own MsDosDateTimeUtils when writing zip entry timestamps).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
